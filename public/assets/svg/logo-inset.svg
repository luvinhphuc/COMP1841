<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 475.2 475.2"
    role="img"
    aria-labelledby="logo-title"
>
    <title id="logo-title">StudentHub inset logo</title>

    <defs>
        <filter
            id="logoInset"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
            color-interpolation-filters="sRGB"
        >
            <feFlood flood-color="#e7eaf0" result="baseColor"/>
            <feComposite
                in="baseColor"
                in2="SourceAlpha"
                operator="in"
                result="base"
            />

            <feGaussianBlur
                in="SourceAlpha"
                stdDeviation="4"
                result="darkBlur"
            />
            <feOffset
                in="darkBlur"
                dx="-5"
                dy="-5"
                result="darkOffset"
            />
            <feComposite
                in="darkOffset"
                in2="SourceAlpha"
                operator="in"
                result="darkInside"
            />
            <feFlood
                flood-color="#596273"
                flood-opacity="0.42"
                result="darkColor"
            />
            <feComposite
                in="darkColor"
                in2="darkInside"
                operator="in"
                result="darkShadow"
            />

            <feGaussianBlur
                in="SourceAlpha"
                stdDeviation="3.5"
                result="lightBlur"
            />
            <feOffset
                in="lightBlur"
                dx="5"
                dy="5"
                result="lightOffset"
            />
            <feComposite
                in="lightOffset"
                in2="SourceAlpha"
                operator="in"
                result="lightInside"
            />
            <feFlood
                flood-color="#ffffff"
                flood-opacity="0.95"
                result="lightColor"
            />
            <feComposite
                in="lightColor"
                in2="lightInside"
                operator="in"
                result="lightShadow"
            />

            <feMerge>
                <feMergeNode in="base"/>
                <feMergeNode in="darkShadow"/>
                <feMergeNode in="lightShadow"/>
            </feMerge>
        </filter>
    </defs>

